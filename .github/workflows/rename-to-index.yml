name: Rename uploaded file to index.html
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file and push
        run: |
          git config user.name "sumanmusahari2-eng"
          git config user.email "sumanmusahari2-eng@users.noreply.github.com"
          if [ -f customer-top-up-store.html ]; then
            git mv customer-top-up-store.html index.html
            git commit -m "Rename customer-top-up-store.html to index.html"
            git push origin HEAD:main
          else
            echo "customer-top-up-store.html not found; nothing to do"
          fi
